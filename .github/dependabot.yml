# Keeps the commit-SHA pins of the GitHub Actions current (security review
# 2026-10-20, F-5): every `uses:` in .github/workflows is pinned to a full
# commit SHA (test_workflow_pins.py refuses a tag), so updates arrive here as
# reviewable pull requests instead of a moving tag running new code unseen.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
