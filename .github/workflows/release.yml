name: Publish release

# Releases are PER-MODEL. Publishing is: stage the firmware into releases/
# (build-scripts/stage_release.ps1), push main, then push a per-model tag of the
# form  v<version>-<MODEL>  e.g.  v2.1.2-RT-BE96U  /  v2.1.2-GT-BE98_PRO.
# This workflow parses the version and model out of the tag, picks up that
# model's staged images, verifies their checksums, extracts the CHANGELOG
# section, and creates the GitHub Release (titled per model) with that model's
# firmware attached.
#
# workflow_dispatch re-publishes/repairs an EXISTING per-model tag.

#
# workflow_call lets public-build.yml hand off to this workflow after a green
# clean-room build on main. It is a DIRECT invocation, not an event, which
# matters: a tag pushed with GITHUB_TOKEN does NOT trigger workflows (GitHub
# blocks that to prevent recursion), so a "push a tag and let release.yml fire"
# hand-off would silently do nothing. Calling it avoids needing a PAT and keeps
# this file the single release authority.

on:
  push:
    tags: ['v*-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing per-model tag to (re)publish, e.g. v2.1.2-RT-BE96U'
        required: true
      run_id:
        description: 'Build run to pull firmware artifacts from (blank = this run). Set it to a green public-build run to publish WITHOUT a rebuild.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      allow_republish:
        description: 'Overwrite an EXISTING release (its assets are clobbered)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Per-model tag to publish, e.g. v2.1.2-RT-BE96U'
        required: true
        type: string
      run_id:
        description: 'Build run to pull firmware artifacts from (blank = the calling run)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      allow_republish:
        description: 'Overwrite an EXISTING release (its assets are clobbered)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag, version and model
        id: ver
        run: |
          set -euo pipefail
          # inputs.tag is set for BOTH workflow_dispatch and workflow_call; it is
          # empty on a tag push, where the ref itself is the tag. Testing the
          # input rather than github.event_name is what makes all three work --
          # under workflow_call github.event_name is still the CALLER's event.
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          # tag = v<X.Y.Z[a]>[-(alpha|beta|rc)[N]]-<MODEL>; model prefixes contain
          # hyphens/underscores (RT-BE96U, GT-BE98_PRO), so pull the version by
          # pattern and treat the remainder as the model. The optional channel
          # segment ("-beta", "-beta2", ...) is part of the VERSION: it is what a
          # Dev publish appends, it keeps beta tags distinct from the final ones,
          # and the *beta* case below is what marks the release pre-release.
          VERSION=$(printf '%s' "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+[a-z]?(-(alpha|beta|rc)[0-9]*)?')
          MODEL="${TAG#${VERSION}-}"
          if [ -z "$VERSION" ] || [ "$MODEL" = "$TAG" ] || [ -z "$MODEL" ]; then
            echo "::error::tag '$TAG' is not of the form v<version>-<MODEL> (e.g. v2.1.2-RT-BE96U)"
            exit 1
          fi
          # THE TAG AND THE FILENAME SPELL THE CHANNEL DIFFERENTLY, on purpose:
          #   tag segment : -beta   (lowercase, hyphen)  v3.1.2-beta-RT-BE96U
          #   file token  : _BETA   (uppercase, underscore)
          #                 RT-BE96U_..._Reaper_v3.1.2_BETA_nand_squashfs.pkgtb
          # The tag form keeps beta tags parseable and sortable next to the final
          # ones; the file form exists because reaper_webs_update.sh derives the
          # RUNNING version with `sed 's/_.*//'`, so an underscore suffix is
          # already stripped by shipped machinery the way _noMCP is, while a
          # hyphen would land inside the number it parses. This is the one place
          # that translates, so both stay correct.
          # BASE is the bare version: it names the in-tree releases/ folder, the
          # SHA256SUMS file and the CHANGELOG section, none of which are
          # per-channel.
          BASE=$(printf '%s' "$VERSION" | sed 's/-\(alpha\|beta\|rc\)[0-9]*$//')
          case "$VERSION" in
            *-beta*)  CHANNEL=beta;   FTOK=_BETA ;;
            *-alpha*) CHANNEL=alpha;  FTOK=_ALPHA ;;
            *-rc*)    CHANNEL=rc;     FTOK=_RC ;;
            *)        CHANNEL=stable; FTOK= ;;
          esac
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"       >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "ftok=$FTOK"       >> "$GITHUB_OUTPUT"
          echo "model=$MODEL"     >> "$GITHUB_OUTPUT"
          echo "resolved: tag=$TAG version=$VERSION base=$BASE channel=$CHANNEL file-token='$FTOK' model=$MODEL"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.tag }}

      # Two sources, in order. Either way the checksums are verified here before
      # anything is attached to a release.
      #   1. in-tree  — images staged by build-scripts/stage_release.ps1 (the
      #                 maintainer's local flow, unchanged)
      #   2. artifacts — the clean-room build that CALLED this workflow. Those
      #                 images are never committed in-tree: release assets do not
      #                 count toward repo size and are what the in-GUI updater
      #                 downloads. Under workflow_call GITHUB_RUN_ID is the
      #                 CALLER's run, which is exactly the build we want.
      - name: Collect and verify this model's firmware assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          B="${{ steps.ver.outputs.base }}"
          FTOK="${{ steps.ver.outputs.ftok }}"
          M="${{ steps.ver.outputs.model }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          stage="$RUNNER_TEMP/assets"
          mkdir -p "$stage"
          shopt -s nullglob

          # The in-tree folder and the checksum list are named for the BARE
          # version (stage_release.ps1 keeps them channel-agnostic); only the
          # image filename carries the channel token. Before 2026-09-10 both
          # globs used the tag's version verbatim, so a beta tag looked for a
          # "*-REAPER-v3.1.2-beta/" folder that stage_release.ps1 never creates
          # and the in-tree route silently fell through to the artifact route.
          imgs=(releases/*/*-REAPER-"$B"/"$M"_3006_102.8_Reaper_"$B""$FTOK"_*.pkgtb)
          if [ ${#imgs[@]} -gt 0 ]; then
            d=$(dirname "${imgs[0]}")
            echo "== in-tree assets: $d ($M)"
            sums=$(ls "$d"/SHA256SUMS-"$M"-Reaper_"$B".txt 2>/dev/null | head -1)
            if [ -z "$sums" ]; then
              echo "::error::missing SHA256SUMS-$M-Reaper_$B.txt in $d"
              exit 1
            fi
            # verify only this model's files against its checksum list
            (cd "$d" && grep -E " ${M}_" "$(basename "$sums")" | sha256sum -c -)
            cp "${imgs[@]}" "$sums" "$stage"/
          else
            # Which run holds the firmware artifacts? Under workflow_call from
            # public-build GITHUB_RUN_ID is the caller's build run (correct). For
            # a manual re-publish, pass run_id = the green build run so we pull its
            # existing artifacts instead of forcing a full rebuild (artifacts are
            # retained 30 days). Blank falls back to this run.
            SRC_RUN="${{ inputs.run_id }}"
            [ -n "$SRC_RUN" ] || SRC_RUN="$GITHUB_RUN_ID"
            echo "== no in-tree images for $M $V; pulling clean-room artifacts from run $SRC_RUN"
            dl="$RUNNER_TEMP/ci"; mkdir -p "$dl"
            gh run download "$SRC_RUN" --repo "$GITHUB_REPOSITORY" \
               --pattern "firmware-${M}-*" --pattern "evidence-${M}-*" --dir "$dl" || true
            imgs=("$dl"/firmware-"$M"-*/*.pkgtb)
            if [ ${#imgs[@]} -eq 0 ]; then
              echo "::error::no images for model '$M' version '$V' — not in releases/*/*-REAPER-$V/ and not in run $SRC_RUN's artifacts"
              echo "   in-tree route: stage with build-scripts/stage_release.ps1 and push before tagging"
              echo "   CI route:      call this workflow from a green public-build run, or dispatch it with run_id set to that build run"
              exit 1
            fi
            # CI writes one SHA256SUMS per variant; merge them into the single
            # per-model list the release publishes.
            cat "$dl"/evidence-"$M"-*/SHA256SUMS-*.txt > "$stage/SHA256SUMS-$M-Reaper_$B.txt"
            cp "${imgs[@]}" "$stage"/
            ( cd "$stage" && sha256sum -c "SHA256SUMS-$M-Reaper_$B.txt" )
          fi
          ls -la "$stage"

          # --- the assets must agree with the channel this tag publishes on ---
          # A mislabelled image reaches exactly the people who cannot tell the
          # branches apart, which is the whole reason the marker exists. Assert
          # rather than trust: the build stamps the name, this checks it, and a
          # disagreement means one of the two is wrong and neither should ship.
          bad=0
          for f in "$stage"/*.pkgtb; do
            case "$(basename "$f")" in
              *_BETA_*|*_ALPHA_*|*_RC_*) got=pre ;;
              *)                         got=stable ;;
            esac
            case "$CHANNEL" in
              stable) want=stable ;;
              *)      want=pre ;;
            esac
            if [ "$got" != "$want" ]; then
              echo "::error::channel mismatch: tag '$V' publishes on the $CHANNEL channel but $(basename "$f") is a $got image"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "   a $CHANNEL release must carry ${FTOK:-no channel token} in its image filenames."
            echo "   Rebuild on the right branch (Dev = beta, main = stable), or stage with"
            echo "   build-scripts/stage_release.ps1 -Channel $( [ "$CHANNEL" = stable ] && echo Stable || echo Beta )."
            exit 1
          fi
          echo "   channel OK: $CHANNEL, $(ls "$stage"/*.pkgtb | wc -l) image(s)"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Build release notes (changelog + per-model images + source provenance)
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          B="${{ steps.ver.outputs.base }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          M="${{ steps.ver.outputs.model }}"
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="${{ github.repository }}"
          notes="$RUNNER_TEMP/notes.md"
          # The asset step already collected+verified this model's images and its
          # SHA256SUMS into $stage, from EITHER source (in-tree or clean-room
          # artifacts). Read the checksum list from there -- never re-glob the
          # in-tree releases/ dir, which is empty for a CI-built version and made
          # `done < "$sums"` abort the step under set -e.
          stage="${{ steps.assets.outputs.stage }}"

          # --- 1. CHANGELOG section for this version -------------------------------
          # Match on the BARE version: the CHANGELOG has one section per release
          # (## v3.1.2), not one per channel, so a "-beta" tag would otherwise
          # find nothing and fall through to the generic stub below.
          awk -v v="$B" '
            $0 ~ "^## "v"([^0-9A-Za-z]|$)" { on=1 }
            on && /^## / && $0 !~ "^## "v { exit }
            on { print }
          ' docs/CHANGELOG.md > "$notes" || true
          if [ ! -s "$notes" ]; then
            printf '## Reaper %s\n\nSee [docs/CHANGELOG.md](https://github.com/%s/blob/%s/docs/CHANGELOG.md).\n' "$V" "$REPO" "$TAG" > "$notes"
          fi

          # --- 2. This model's flashable images + SHA-256 --------------------------
          {
            printf '\n---\n\n## Images & checksums (%s)\n\n' "$M"
            printf 'Two flashable images: **+ AI Advisor** (default) and **Standard** (`noMCP`, all AI components compiled out entirely). Flash the `*_nand_squashfs.pkgtb` via Administration > Firmware Upgrade.\n\n'
            if [ "$CHANNEL" != stable ]; then
              printf '> **This is a %s release.** Its filename carries `_BETA` and the router reports the same string on the dashboard and the About page, so you can always tell which channel a flashed image came from. Stable releases carry no marker.\n\n' "$CHANNEL"
            fi
            printf '| Variant | File | SHA-256 |\n|---|---|---|\n'
            sums="$stage/SHA256SUMS-$M-Reaper_$B.txt"
            if [ -f "$sums" ]; then
              while read -r sha file; do
                [ -z "${file:-}" ] && continue
                file="${file#\*}"   # sha256sum binary-mode marker, if present
                case "$file" in *noMCP*) variant="Standard" ;; *) variant="+ AI Advisor" ;; esac
                printf '| %s | `%s` | `%s` |\n' "$variant" "$file" "$sha"
              done < "$sums"
            fi
            printf '\nVerify a download against the attached `SHA256SUMS-%s-Reaper_%s.txt`.\n' "$M" "$B"
          } >> "$notes"

          # --- 3. Corresponding source, tag-pinned, + reproducibility --------------
          # jq is preinstalled on GitHub-hosted runners; pull the recorded source
          # fingerprints for this version from the provenance manifest.
          tree=$(jq -r --arg v "$V" '(.releases[] | select(.version==$v) | .source_tree["release/src/router"]) // empty' provenance/manifest.json 2>/dev/null || true)
          pc=$(jq -r --arg v "$V" '(.releases[] | select(.version==$v) | .patch_count) // empty' provenance/manifest.json 2>/dev/null || true)
          {
            printf '\n---\n\n## Corresponding source & reproducibility\n\n'
            printf 'The **%s** image for `%s` is built from this repository **at tag `%s`**: the pinned Asuswrt-Merlin base (`3006.102.8-beta2`, `a7ebfa133a`) plus the complete patch series. The tag freezes the exact source that produced it.\n\n' "$M" "$V" "$TAG"
            if [ -n "$pc" ]; then
              printf -- '- **Patches:** [`patches/`](https://github.com/%s/tree/%s/patches) (`0001`-`%04d`)\n' "$REPO" "$TAG" "$pc"
            else
              printf -- '- **Patches:** [`patches/`](https://github.com/%s/tree/%s/patches)\n' "$REPO" "$TAG"
            fi
            printf -- '- **Provenance record:** [`provenance/manifest.json`](https://github.com/%s/blob/%s/provenance/manifest.json)\n' "$REPO" "$TAG"
            if [ -n "$tree" ]; then
              printf -- '- **Source tree hash** (`release/src/router`): `%s` -- reproduce by `git am --keep-cr` of the patches onto the base, then `git rev-parse HEAD:release/src/router`.\n' "$tree"
            fi
            printf -- '- **How to verify:** [`docs/REPRODUCIBILITY.md`](https://github.com/%s/blob/%s/docs/REPRODUCIBILITY.md) and [`docs/SOURCE-AVAILABILITY.md`](https://github.com/%s/blob/%s/docs/SOURCE-AVAILABILITY.md)\n' "$REPO" "$TAG" "$REPO" "$TAG"
            printf '\nThe auto-attached **Source code (zip/tar.gz)** asset below is this repository at tag `%s` (patches + docs).\n' "$TAG"
          } >> "$notes"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          M="${{ steps.ver.outputs.model }}"
          stage="${{ steps.assets.outputs.stage }}"
          pre=""
          case "$V" in *alpha*|*beta*|*rc*) pre="--prerelease" ;; esac
          # RT-BE92U is RETIRED from the build roster (owner, 2026-09-10 - Merlin
          # has taken that model on). public-build no longer offers it, so this
          # case is unreachable from a fleet run. It is kept, not deleted,
          # because the model's source is dormant rather than gone: if the tag is
          # ever published by hand it must still go out as a prerelease, which is
          # what it has always been. Deleting the line would silently change that
          # for the one path that can still reach it.
          case "$M" in RT-BE92U) pre="--prerelease" ;; esac
          # Honor an explicit prerelease input from BOTH workflow_dispatch and
          # workflow_call (public-build passes prerelease=true on a Dev publish).
          # On a tag push the input is empty, so this is a no-op there.
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            pre="--prerelease"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # REPUBLISH GUARD. Overwriting a published release replaces the
            # assets the in-GUI updater downloads, so it is never a side effect
            # of something else -- it has to be asked for. This matters most on
            # the public-build.yml hand-off: EXPECTED_VERSION is pinned, so once
            # a version has shipped, every later run on main would otherwise
            # clobber five live releases with clean-room artifacts. On a `push`
            # event inputs are empty, so that path is guarded too.
            if [ "${{ inputs.allow_republish }}" != "true" ]; then
              echo "::warning::release $TAG already exists — NOT overwriting it."
              echo "  Nothing was published. The existing release and its assets are untouched."
              echo "  To replace them deliberately: run this workflow via workflow_dispatch"
              echo "  with allow_republish = true, or delete the release first."
              echo "skipped: https://github.com/${{ github.repository }}/releases/tag/$TAG"
              exit 0
            fi
            echo "release $TAG exists and allow_republish=true — updating notes and re-uploading assets"
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "Reaper $V — $M" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "$stage"/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" $pre --verify-tag \
              --repo "${{ github.repository }}" \
              --title "Reaper $V — $M" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "$stage"/*
          fi
          echo "published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
