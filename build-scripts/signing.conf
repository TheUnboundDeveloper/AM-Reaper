# Manifest-signing switch (owner decision 2026-08-23: shelved for now).
#
# off = the tooling and CI treat the update manifest as unsigned: no signing
#       attempts, no warnings, no red CI steps, hygiene skips the .sig check.
# on  = every flow signs/enforces again (stage_release, refresh_manifest, the
#       publish workflow's signature-status step, repo-hygiene).
#
# IMPORTANT: this file only governs the REPO side. The routers' behaviour is
# baked at build time by REAPER_SIG_ENFORCE in
# release/src/router/rom/webs_scripts/reaper_webs_update.sh - flip BOTH (and
# rebuild) to re-enable end to end. The keypair, sign_manifest.sh, the
# embedded public key and the verify code all remain in place, inert.
MANIFEST_SIGNING=off
