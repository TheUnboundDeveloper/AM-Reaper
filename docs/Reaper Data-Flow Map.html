<style>
/* Layout: one-screen schematic viewer. Header strip (title + search + flow filters),
   full-bleed pan/zoom drawing, detail panel docked right (bottom sheet on phones). */
:root {
  --paper: #eef2f1; --paper-2: #e3e9e7; --zone: rgba(23, 50, 60, .035); --zone-line: #c3cecb;
  --ink: #162027; --ink-2: #4b5a61; --ink-3: #7b8a90; --rule: #c9d3d1; --grid: #cfd8d6;
  --node: #fbfcfc; --node-line: #8a9a9f; --chrome: rgba(251, 252, 252, .92); --accent: #d9480f;
  --k-packet: #1c6dd0; --k-wireless: #0b8a8c; --k-mesh: #6a43e0; --k-dns: #b86e00; --k-control: #5c6b73;
  --k-telemetry: #2b8a3e; --k-storage: #8d5b2e; --k-ui: #c2255c; --k-cloud: #d92f2f;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1316; --paper-2: #121a1e; --zone: rgba(190, 220, 230, .028); --zone-line: #2b383e;
  --ink: #dde7ea; --ink-2: #9aabb2; --ink-3: #6c7d84; --rule: #2a363c; --grid: #1c262b;
  --node: #161f24; --node-line: #4f6067; --chrome: rgba(18, 26, 30, .92); --accent: #ff7a3d;
  --k-packet: #5aa2ff; --k-wireless: #3cc6c2; --k-mesh: #a18bff; --k-dns: #f2b33d; --k-control: #9aaab2;
  --k-telemetry: #5ccb72; --k-storage: #c99460; --k-ui: #f06595; --k-cloud: #ff6b6b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0d1316; --paper-2: #121a1e; --zone: rgba(190, 220, 230, .028); --zone-line: #2b383e;
  --ink: #dde7ea; --ink-2: #9aabb2; --ink-3: #6c7d84; --rule: #2a363c; --grid: #1c262b;
  --node: #161f24; --node-line: #4f6067; --chrome: rgba(18, 26, 30, .92); --accent: #ff7a3d;
  --k-packet: #5aa2ff; --k-wireless: #3cc6c2; --k-mesh: #a18bff; --k-dns: #f2b33d; --k-control: #9aaab2;
  --k-telemetry: #5ccb72; --k-storage: #c99460; --k-ui: #f06595; --k-cloud: #ff6b6b; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
.app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--chrome); position: relative; z-index: 3; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
.brand .sub { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--node); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 320px; overflow: auto; z-index: 6; }
.results button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; font: inherit; padding: 7px 10px; border: 0; background: none; color: var(--ink); cursor: pointer; }
.results button:hover, .results button.on { background: var(--paper-2); }
.results small { font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 10 1 360px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; padding: 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chip:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip i { width: 18px; height: 0; border-top: 2px solid currentColor; display: inline-block; }
.chip i.dash { border-top-style: dashed; } .chip i.dot { border-top-style: dotted; border-top-width: 3px; }
.chip .n { font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .45; } .chip[aria-pressed="false"] i { border-top-color: var(--ink-3) !important; }
.stage { flex: 1; position: relative; min-height: 0; }
svg#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg#map.drag { cursor: grabbing; }
.zone-box { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; }
.zone-title { font-family: var(--f-mono); font-size: 13px; font-weight: 500; fill: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; cursor: zoom-in; }
.zone-desc { font-size: 12px; fill: var(--ink-3); }
.edge { fill: none; stroke-width: 1.15; opacity: .5; transition: opacity .15s; }
.edge.dash { stroke-dasharray: 6 4; } .edge.dot { stroke-dasharray: 1.5 3.5; stroke-linecap: round; stroke-width: 1.6; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 9; cursor: help; }
.node { cursor: pointer; }
.node rect.body { fill: var(--node); stroke: var(--node-line); stroke-width: 1; }
.node.hw rect.body { stroke-width: 2.2; }
.node.external rect.body { stroke-dasharray: 5 3; }
.node.off rect.body { stroke-dasharray: 2 3; }
.node.closed rect.hatch { fill: url(#hatch); }
.node text.tag { font-family: var(--f-mono); font-size: 9px; fill: var(--ink-3); letter-spacing: .05em; }
.node text.name { font-size: 13px; font-weight: 500; fill: var(--ink); }
.node:hover rect.body { stroke: var(--ink); }
.node:focus-visible { outline: none; } .node:focus-visible rect.body { stroke: var(--accent); stroke-width: 2.5; }
svg.focus .edge { opacity: .05; } svg.focus .node { opacity: .22; } svg.focus .zone-box { opacity: .6; }
svg.focus .edge.hl { opacity: 1; stroke-width: 2.1; } svg.focus .node.hl { opacity: 1; }
svg.focus .node.sel rect.body { stroke: var(--accent); stroke-width: 2.6; }
.bundle { fill: none; opacity: .55; stroke-linecap: round; display: none; cursor: zoom-in; }
.bundle:hover { opacity: .95; }
svg.far .bundle { display: inline; } svg.far .edge, svg.far .edge-hit { display: none; }
svg.far .node text, svg.far .zone-desc { display: none; }
.edge.inter { opacity: .32; }
.farlabels span { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.tblock rect { fill: var(--node); stroke: var(--ink-2); stroke-width: 1.4; } .tblock line { stroke: var(--ink-2); stroke-width: .8; }
.tblock .k { font-family: var(--f-mono); font-size: 9px; fill: var(--ink-3); letter-spacing: .06em; } .tblock .v { font-size: 13px; fill: var(--ink); } .tblock .t { font-size: 17px; font-weight: 600; fill: var(--ink); }
.farlabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.farlabels div { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--chrome); border: 1px solid var(--rule); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.tip { position: absolute; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--paper); font-size: 12.5px; line-height: 1.35; padding: 7px 9px; border-radius: 6px; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.tip b { font-weight: 600; } .tip code { font-family: var(--f-mono); font-size: 10px; opacity: .8; }
.ctl { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.ctl button { width: 36px; height: 36px; font: inherit; font-size: 18px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chrome); color: var(--ink); cursor: pointer; }
.ctl button.txt { font-size: 11px; font-family: var(--f-mono); }
.mini { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 200px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chrome); z-index: 3; cursor: crosshair; touch-action: none; }
.mini canvas { display: block; width: 100%; border-radius: 6px; }
.panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--node); border-left: 1px solid var(--rule); z-index: 4; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.08); }
.panel-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
.panel-head h2 { margin: 0; font-size: 19px; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.panel-head .kind { font-family: var(--f-mono); font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.panel-head button { margin-left: auto; font: inherit; font-size: 18px; width: 32px; height: 32px; flex: none; border: 1px solid var(--rule); border-radius: 6px; background: none; color: var(--ink); cursor: pointer; }
.panel-body { overflow: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.panel-body p { margin: 0; line-height: 1.45; max-width: 60ch; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-2); }
.flag.warn { border-color: var(--k-dns); color: var(--k-dns); }
.ev { font-family: var(--f-mono); font-size: 10.5px; line-height: 1.5; color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.panel h3 { margin: 0 0 6px; font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.flows { display: flex; flex-direction: column; gap: 2px; }
.flows button { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 8px; text-align: left; font: inherit; padding: 6px 8px; border: 0; border-radius: 5px; background: none; color: var(--ink); cursor: pointer; }
.flows button:hover { background: var(--paper-2); }
.flows i { grid-row: span 2; width: 12px; height: 0; margin-top: 8px; border-top: 2px solid currentColor; }
.flows .who { font-weight: 600; overflow-wrap: anywhere; } .flows .what { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.flows .what code { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
@media (max-width: 640px) {
  .panel { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .mini { display: none; }
  .filters { flex-wrap: nowrap; overflow-x: auto; flex-basis: 100%; padding-bottom: 2px; }
}
@media (prefers-reduced-motion: reduce) { .edge { transition: none; } }
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>Reaper Data-Flow Map</h1>
      <span class="sub" id="sub"></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Find a component (dnsmasq, br0, rtrafd...)" autocomplete="off" aria-label="Find a component">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="filters" id="filters" aria-label="Flow types"></div>
  </header>
  <div class="stage" id="stage">
    <svg id="map" role="img" aria-label="Data-flow map of the router: zones, components and the flows between them">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" style="fill:var(--grid)"></circle></pattern>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--rule)" stroke-width="2.5"></line></pattern>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="farlabels" id="farlabels"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="mini" id="mini" aria-hidden="true"><canvas id="minic" width="400" height="260"></canvas></div>
    <div class="ctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="fit" class="txt" aria-label="Fit the whole map">FIT</button>
    </div>
    <aside class="panel" id="panel" hidden aria-live="polite"></aside>
    <div class="loading" id="loading">Drawing the map&hellip;</div>
  </div>
</div>

<script type="application/json" id="inv">{"zones":[{"id":"external","label":"External endpoints","desc":"Internet services and remote parties the router talks to, or that reach it."},{"id":"wan_edge","label":"WAN edge and hardware","desc":"Physical ports, the Ethernet switch, the Runner packet processor and its offload engines."},{"id":"dataplane","label":"Kernel data plane","desc":"Linux 4.19 netdevs, Broadcom blog/flow cache, conntrack, neighbour and bridge tables."},{"id":"netfilter","label":"Netfilter and firewall layers","desc":"iptables/ip6tables/ebtables tables and chains: stock chains plus Reaper's Warden, Gatekeeper, rules engine and guards."},{"id":"routing","label":"Routing, policy routing and tunnels","desc":"Routing tables, ip rule bands, Policy Routing marks, VPN Director, WireGuard/OpenVPN/IPsec, WAN clients, IPv6 uplinks."},{"id":"qos","label":"QoS and traffic manager","desc":"Hardware egress traffic manager queues, ingress policer, software shapers and the rc QoS engine."},{"id":"lan","label":"LAN, bridges and segmentation","desc":"br0, SDN/guest/VLAN bridges, WAN port pinning, discovery and multicast helpers, captive portal."},{"id":"wireless","label":"Wireless","desc":"Radios, MLO, Broadcom driver/dongle, hostapd, channel selection and Reaper's puncturing/width/quality tools."},{"id":"mesh","label":"AiMesh","desc":"Closed AiMesh controller/agents, backhaul, node channel fit and backhaul parking."},{"id":"core","label":"Core control plane","desc":"init/rc, service dispatch, watchdog, nvram, cron, syslog, hotplug, WAN state machine, NTP, firewall lock."},{"id":"netsvc","label":"Network services","desc":"dnsmasq (DNS/DHCP/RA), DoT, resolver health, name helpers, UPnP, DDNS/ACME, SNMP, speed test."},{"id":"storage","label":"Storage, USB and persistence","desc":"/jffs stores, /tmp tmpfs, USB disks and mount chain, file sharing, long-term history store."},{"id":"mgmt","label":"Management and UI","desc":"httpd and its auth, Reaper pages and CGI endpoints, SSH, firmware update/flash, backup, MCP Advisor."},{"id":"telemetry","label":"Telemetry and security monitoring","desc":"Collectors, watchdogs, walkers and closed monitors: rtrafd, rdnsmapd, rwatch, gkd, Warden updater, networkmap, protect_srv."},{"id":"clients","label":"Clients and operators","desc":"LAN/Wi-Fi/SDN clients, the admin browser, an AI client, a metrics scraper."}],"nodes":[{"id":"isp_upstream","label":"ISP upstream","zone":"external","kind":"external","desc":"The provider's access network: DHCP/PPPoE server and first-hop gateway on the WAN port.","closed":false,"default":"on","variant":"both","confidence":"high","evidence":"rc/wanduck.c; rc/udhcpc.c; memory wan-rehome-autowanport"},{"id":"dns_upstream","label":"Upstream DNS resolvers","zone":"external","kind":"external","desc":"WAN-assigned or user-set resolvers dnsmasq forwards to (plain DNS); may be a LAN filter such as AdGuard/Pi-hole listed first.","closed":false,"default":"on","variant":"both","confidence":"high","evidence":"memory dns-upstream-fallback; rc/rdnshc.c"},{"id":"dot_upstream","label":"DNS-over-TLS servers","zone":"external","kind":"external","desc":"DoT resolvers stubby connects to on TCP 853 when DNS Privacy is on (replaces the WAN DNS list).","closed":false,"default":"off","variant":"both","confidence":"high","evidence":"memory dns-upstream-fallback; rc/services.c stubby 127.0.1.1@53"},{"id":"ntp_servers","label":"NTP servers","zone":"external","kind":"external","desc":"Time servers (pool or user-set) the router syncs from; Warden's router-self filter exempts them.","closed":false,"default":"on","variant":"both","confidence":"high","evidence":"guide 4.3.6; memory phone-home-audit"},{"id":"github_raw","label":"GitHub raw (update manifest)","zone":"external","kind":"external","desc":"raw.githubusercontent.com: Reaper's plain-text update manifest (and the FireHOL/DShield feed files).","closed":false,"default":"on","variant":"both","confidence":"high","evidence":"rom/webs_scripts/reap "},{"from":"dreadwatch_hits","to":"dw_collector","kind":"telemetry","label":"moved out and folded","evidence":"rc/rwarden.c rw_gen_dns","confidence":"high"},{"from":"dw_collector","to":"jffs_rwarden","kind":"storage","label":"banks dns.counters (totals, per feed, top 100 names and devices)","evidence":"rc/rwarden.c RW_DNS_CTRS","confidence":"high"},{"from":"dw_collector","to":"tmpfs","kind":"storage","label":"newest 500 records in /tmp/rwarden/dns.recent","evidence":"rc/rwarden.c RW_DNS_REC","confidence":"high"},{"from":"rwarden","to":"dreadwatch_hits","kind":"control","label":"creates /tmp/dreadwatch for dnsmasq's run user; clears records when switched off","evidence":"rc/rwarden.c rw_hits_dir, stop_rwarden","confidence":"high"},{"from":"rwatch","to":"jffs_reaper","kind":"config","label":"security review reads review/rules (first match wins) and the baseline","evidence":"rc/rwatch.c RV_RULES","confidence":"high"},{"from":"cgi_cfg","to":"jffs_reaper","kind":"storage","label":"settings export/import carries review/rules (validated on import)","evidence":"httpd/web.c rcfg_flags rwatch_rules","confidence":"high"},{"from":"gk_state","to":"gk_sink","kind":"control","label":"apply.sh starts it from the root-only sink.conf with a clean signal mask; teardown stops it by exact cmdline","evidence":"rc/gatekeeper.c GK_SINK_KILL","confidence":"high"},{"from":"gk_chains","to":"gk_sink","kind":"packet","label":"held devices' DNS (udp/tcp 53) redirected to 5300, both families","evidence":"rc/gatekeeper.c quarantine branch","confidence":"high","proto":"REDIRECT"},{"from":"gkd","to":"gk_sink","kind":"control","label":"restarts it when it dies (two misses, at most 3 re-applies)","evidence":"gkd/gkd.c heal_sink","confidence":"high"},{"from":"rdnsmapd","to":"dnsmasq_conf","kind":"config","label":"reads advertised resolvers (dhcp-option 6 / option6:23) every 30 s for the source policy","evidence":"rdnsmapd/rdnsmapd.c rdm_src_load","confidence":"high"},{"from":"rdnsmapd","to":"syslogd","kind":"log","label":"ignored LAN-forged replies, one line per 10 min","evidence":"rdnsmapd/rdnsmapd.c rdm_src_report","confidence":"high"}]}</script>
<script>
(() => {
const INV = JSON.parse(document.getElementById("inv").textContent);
const LAY = JSON.parse(document.getElementById("lay").textContent);
const META = INV.meta || {};
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("map"), vp = $("vp"), stage = $("stage");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Flow kinds: colour family + line style. Unknown kinds fall back to control.
const KINDS = {
  packet:    { c: "packet",    s: "",     name: "Data plane" },
  wireless:  { c: "wireless",  s: "",     name: "Wireless" },
  mesh:      { c: "mesh",      s: "",     name: "AiMesh" },
  dns:       { c: "dns",       s: "",     name: "DNS" },
  dhcp:      { c: "dns",       s: "dash", name: "DHCP" },
  control:   { c: "control",   s: "",     name: "Control" },
  config:    { c: "control",   s: "dash", name: "Config / nvram" },
  telemetry: { c: "telemetry", s: "",     name: "Telemetry" },
  log:       { c: "telemetry", s: "dot",  name: "Logs" },
  storage:   { c: "storage",   s: "",     name: "Storage" },
  ui:        { c: "ui",        s: "",     name: "Web UI" },
  cloud:     { c: "cloud",     s: "",     name: "Internet services" },
};
const kindOf = k => KINDS[k] ? k : "control";
const col = k => `var(--k-${KINDS[kindOf(k)].c})`;

const zones = Object.fromEntries(INV.zones.map(z => [z.id, z]));
const nodes = Object.fromEntries(INV.nodes.map(n => [n.id, n]));
const edges = LAY.keptEdges.map((e, i) => ({ ...e, i, k: kindOf(e.kind) }));
const adj = {}; for (const id in nodes) adj[id] = { in: [], out: [] };
for (const e of edges) { adj[e.from].out.push(e); adj[e.to].in.push(e); }

$("sub").textContent = `${META.firmware || "Reaper"} · ${INV.nodes.length} components · ${edges.length} flows · ${INV.zones.length} zones`;

const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---- world ----
const M = 1200, TB_W = 420, TB_H = 150;
const WORLD = { x: -M, y: -M, w: LAY.w + 2 * M, h: LAY.h + 2 * M + TB_H };
el("rect", { x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h, fill: "url(#dots)" }, vp);

// arrow markers, one per colour family
const defs = svg.querySelector("defs");
for (const fam of new Set(Object.values(KINDS).map(k => k.c))) {
  const m = el("marker", { id: "ar-" + fam, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, defs);
  el("path", { d: "M0 1.5L10 5L0 8.5z", style: `fill:var(--k-${fam})` }, m);
}

const gZones = el("g", {}, vp), gEdges = el("g", {}, vp), gNodes = el("g", {}, vp), gHits = el("g", {}, vp);
for (const z of LAY.zones) {
  const g = el("g", { "data-zone": z.id }, gZones);
  el("rect", { class: "zone-box", x: z.x, y: z.y, width: z.w, height: z.h, rx: 10 }, g);
  const t = el("text", { class: "zone-title", x: z.x + 18, y: z.y + 24 }, g); t.textContent = (zones[z.id]?.label || z.id);
  if (zones[z.id]?.desc) { const d = el("text", { class: "zone-desc", x: z.x + 18, y: z.y + 41 }, g); d.textContent = trimTo(zones[z.id].desc, Math.floor((z.w - 36) / 5.8)); }
  t.addEventListener("click", ev => { ev.stopPropagation(); zoomToBox(z.x, z.y, z.w, z.h); });
}
function trimTo(s, n) { return s.length > n ? s.slice(0, Math.max(0, n - 1)).trimEnd() + "…" : s; }

// zone-pair bundles: the overview at far zoom (constant screen width, coloured by the dominant flow type)
const gBundles = el("g", { class: "bundles" }, vp);
gZones.after(gBundles);
const bundleEls = [];
for (const b of LAY.bundles) {
  const dom = Object.entries(b.kinds).sort((p, q) => q[1] - p[1])[0][0];
  const p = el("path", { d: b.d, class: "bundle", "vector-effect": "non-scaling-stroke" }, gBundles);
  p.style.stroke = col(dom); p.style.strokeWidth = (1.4 + Math.sqrt(b.n) * 1.5).toFixed(1) + "px";
  const tipHtml = `<b>${esc(zones[b.a]?.label || b.a)} ↔ ${esc(zones[b.b]?.label || b.b)}</b><br>${b.n} flow${b.n > 1 ? "s" : ""}: ` +
    Object.entries(b.kinds).sort((p, q) => q[1] - p[1]).map(([k, n]) => `${n} ${KINDS[kindOf(k)].name.toLowerCase()}`).join(", ");
  p.addEventListener("pointerenter", ev => showTip(ev, tipHtml));
  p.addEventListener("pointermove", moveTip);
  p.addEventListener("pointerleave", hideTip);
  p.addEventListener("click", ev => { ev.stopPropagation(); const A = LAY.zones.find(z => z.id === b.a), B = LAY.zones.find(z => z.id === b.b); const x0 = Math.min(A.x, B.x), y0 = Math.min(A.y, B.y); zoomToBox(x0, y0, Math.max(A.x + A.w, B.x + B.w) - x0, Math.max(A.y + A.h, B.y + B.h) - y0); });
  bundleEls.push({ b, p });
}

const edgeEls = [];
for (const L of LAY.edges) {
  const e = edges[L.i]; if (!e || !L.d) continue;
  const d = L.d;
  const st = KINDS[e.k].s;
  const p = el("path", { d, class: `edge ${st} ${L.t}`, stroke: "", "marker-end": `url(#ar-${KINDS[e.k].c})`, "data-k": e.k }, gEdges);
  p.style.stroke = col(e.k);
  const h = el("path", { d, class: "edge-hit", "data-k": e.k }, gHits);
  h.addEventListener("pointerenter", ev => showTip(ev, edgeTip(e)));
  h.addEventListener("pointermove", moveTip);
  h.addEventListener("pointerleave", hideTip);
  h.addEventListener("click", ev => { ev.stopPropagation(); select(e.from, { keepView: true }); });
  edgeEls[e.i] = { p, h };
}

const nodeEls = {};
for (const id in LAY.nodes) {
  const n = nodes[id], L = LAY.nodes[id]; if (!n) continue;
  const cls = ["node", n.kind || "", n.closed ? "closed" : "", n.default === "off" ? "off" : ""].join(" ");
  const g = el("g", { class: cls, transform: `translate(${L.x} ${L.y})`, tabindex: "0", role: "button", "aria-label": `${n.label}: ${n.desc || n.kind}` }, gNodes);
  const rx = n.kind === "external" ? Math.min(L.h / 2, 20) : (["kernel", "chain", "table", "hw"].includes(n.kind) ? 2 : (["file", "nvram", "shm", "store", "socket"].includes(n.kind) ? 4 : 8));
  el("rect", { class: "body", width: L.w, height: L.h, rx }, g);
  if (n.closed) el("rect", { class: "hatch", x: L.w - 26, y: 1, width: 25, height: L.h - 2, rx: Math.max(0, rx - 1) }, g);
  const tag = el("text", { class: "tag", x: 11, y: 16 }, g); tag.textContent = L.tag;
  L.lines.forEach((ln, i) => { const t = el("text", { class: "name", x: 11, y: 33 + i * 15 }, g); t.textContent = ln; });
  g.addEventListener("click", ev => { ev.stopPropagation(); select(id, { keepView: true }); });
  g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(id, { keepView: true }); } });
  g.addEventListener("pointerenter", ev => { if (!view.dragging) showTip(ev, `<b>${esc(n.label)}</b><br>${esc(n.desc || "")}`); });
  g.addEventListener("pointermove", moveTip);
  g.addEventListener("pointerleave", hideTip);
  nodeEls[id] = g;
}

// engineering title block, bottom right of the sheet
{
  const x = LAY.w - TB_W, y = LAY.h + 40, g = el("g", { class: "tblock" }, vp);
  el("rect", { x, y, width: TB_W, height: TB_H - 30 }, g);
  el("line", { x1: x, y1: y + 40, x2: x + TB_W, y2: y + 40 }, g);
  el("line", { x1: x, y1: y + 80, x2: x + TB_W, y2: y + 80 }, g);
  el("line", { x1: x + TB_W / 2, y1: y + 40, x2: x + TB_W / 2, y2: y + TB_H - 30 }, g);
  const T = (cls, tx, ty, s) => { const t = el("text", { class: cls, x: tx, y: ty }, g); t.textContent = s; };
  T("t", x + 14, y + 27, "REAPER · DATA-FLOW MAP");
  T("k", x + 14, y + 54, "FIRMWARE"); T("v", x + 14, y + 71, META.firmware || "");
  T("k", x + TB_W / 2 + 14, y + 54, "MODEL"); T("v", x + TB_W / 2 + 14, y + 71, META.model || "");
  T("k", x + 14, y + 94, "SOURCE"); T("v", x + 14, y + 111, META.source || "");
  T("k", x + TB_W / 2 + 14, y + 94, "DRAWN"); T("v", x + TB_W / 2 + 14, y + 111, META.drawn || "");
}

// ---- view: pan / zoom ----
const view = { s: 1, x: 0, y: 0, dragging: false };
const MIN_S = 0.012, MAX_S = 3;
function apply() {
  vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.s})`);
  svg.classList.toggle("far", view.s < 0.42);
  drawFar(); drawMini();
}
function zoomAt(px, py, f) {
  const s = Math.min(MAX_S, Math.max(MIN_S, view.s * f)); f = s / view.s;
  view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.s = s; apply();
}
function zoomToBox(x, y, w, h, pad = 40) {
  const r = stage.getBoundingClientRect(), pw = panelOpen() && innerWidth > 640 ? 380 : 0;
  const ph = panelOpen() && innerWidth <= 640 ? r.height * .62 : 0;
  const aw = r.width - pw - pad * 2, ah = r.height - ph - pad * 2;
  view.s = Math.min(MAX_S, Math.max(MIN_S, Math.min(aw / w, ah / h)));
  view.x = pad + (aw - w * view.s) / 2 - x * view.s; view.y = pad + (ah - h * view.s) / 2 - y * view.s; apply();
}
// content bounds = zones + title block + every curve's control points (a cubic stays inside its hull)
const BOUNDS = (() => {
  let x0 = 0, y0 = 0, x1 = LAY.w, y1 = LAY.h + TB_H;
  for (const s of [...LAY.bundles.map(b => b.d), ...LAY.edges.map(e => e.d)]) {
    const v = s.match(/-?\d+(\.\d+)?/g).map(Number);
    for (let i = 0; i + 1 < v.length; i += 2) { x0 = Math.min(x0, v[i]); x1 = Math.max(x1, v[i]); y0 = Math.min(y0, v[i + 1]); y1 = Math.max(y1, v[i + 1]); }
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
})();
const fitAll = () => zoomToBox(BOUNDS.x, BOUNDS.y, BOUNDS.w, BOUNDS.h, 28);
function centerOn(id, minS = 0.9) {
  const L = LAY.nodes[id]; if (!L) return;
  const r = stage.getBoundingClientRect(), pw = panelOpen() && innerWidth > 640 ? 380 : 0;
  const ph = panelOpen() && innerWidth <= 640 ? r.height * .62 : 0;
  view.s = Math.max(view.s, minS);
  view.x = (r.width - pw) / 2 - (L.x + L.w / 2) * view.s; view.y = (r.height - ph) / 2 - (L.y + L.h / 2) * view.s; apply();
}

svg.addEventListener("wheel", ev => {
  ev.preventDefault(); const r = svg.getBoundingClientRect();
  const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0018)));
}, { passive: false });
const ptrs = new Map(); let pinch = null, moved = 0;
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node") || ev.target.closest(".zone-title")) return;
  svg.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]); moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; }
  view.dragging = true; svg.classList.add("drag"); hideTip();
});
svg.addEventListener("pointermove", ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const prev = ptrs.get(ev.pointerId); ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = svg.getBoundingClientRect();
    zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, d / pinch.d); pinch.d = d; moved += 10; return;
  }
  const dx = ev.clientX - prev[0], dy = ev.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
  view.x += dx; view.y += dy; apply();
});
const endPtr = ev => { ptrs.delete(ev.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { view.dragging = false; svg.classList.remove("drag"); } };
svg.addEventListener("pointerup", ev => { const wasTap = moved < 4 && ptrs.size === 1; endPtr(ev); if (wasTap && !ev.target.closest(".edge-hit")) clearSel(); });
svg.addEventListener("pointercancel", endPtr);
$("zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.4); };
$("zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.4); };
$("fit").onclick = fitAll;
addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") return;
  if (ev.key === "Escape") clearSel();
  else if (ev.key === "+" || ev.key === "=") $("zin").click();
  else if (ev.key === "-") $("zout").click();
  else if (ev.key === "0") fitAll();
  else if (ev.key === "/") { ev.preventDefault(); $("q").focus(); }
});

// far-zoom zone labels in screen space
const far = $("farlabels");
const SHORT = { external: "Internet & services", wan_edge: "WAN edge", dataplane: "Data plane", netfilter: "Netfilter", routing: "Routing & tunnels",
  qos: "QoS", lan: "LAN", wireless: "Wireless", mesh: "AiMesh", clients: "Clients", storage: "Storage", telemetry: "Telemetry", core: "Core control",
  mgmt: "Management & UI", netsvc: "Network services" };
const farEls = LAY.zones.map(z => { const d = document.createElement("div"); d.textContent = SHORT[z.id] || zones[z.id]?.label || z.id; far.appendChild(d); return { z, d }; });
const countEls = bundleEls.filter(({ b }) => b.n >= 5).map(({ b, p }) => {
  const len = p.getTotalLength(), m = p.getPointAtLength(len / 2), s = document.createElement("span");
  s.textContent = b.n; far.appendChild(s); return { m, s };
});
function drawFar() {
  const on = view.s < 0.42; far.hidden = !on; if (!on) return;
  // greedy placement: bigger zones first, then the busiest bundles; anything that would overlap waits for a closer zoom
  const r = stage.getBoundingClientRect(), placed = [];
  const fits = (x, y, w, h) => { const b = [x - w / 2 - 3, y - h / 2 - 2, x + w / 2 + 3, y + h / 2 + 2]; if (placed.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1])) return false; placed.push(b); return true; };
  for (const { z, d } of farOrder) {
    d.style.visibility = "visible";
    const w = d.offsetWidth, h = d.offsetHeight, half = w / 2 + 6;
    const x = Math.min(r.width - half, Math.max(half, view.x + (z.x + z.w / 2) * view.s)), y = view.y + z.y * view.s;
    d.style.left = x + "px"; d.style.top = y + "px";
    if (!fits(x, y, w, h)) d.style.visibility = "hidden";
  }
  for (const { m, s } of countOrder) {
    s.style.visibility = "visible";
    const x = view.x + m.x * view.s, y = view.y + m.y * view.s;
    s.style.left = x + "px"; s.style.top = y + "px";
    if (!fits(x, y, s.offsetWidth, s.offsetHeight)) s.style.visibility = "hidden";
  }
}
const farOrder = [...farEls].sort((p, q) => q.z.w * q.z.h - p.z.w * p.z.h);
const countOrder = [...countEls].sort((p, q) => Number(q.s.textContent) - Number(p.s.textContent));

// minimap
const mc = $("minic"), mx = mc.getContext("2d"), mini = $("mini");
const MS = Math.min(mc.width / LAY.w, mc.height / LAY.h);
mc.height = Math.ceil(LAY.h * MS) + 8; const MO = 4;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawMini() {
  if (mini.offsetParent === null) return;
  mx.clearRect(0, 0, mc.width, mc.height);
  mx.fillStyle = cssVar("--zone-line");
  for (const z of LAY.zones) mx.fillRect(MO + z.x * MS, MO + z.y * MS, z.w * MS, z.h * MS);
  mx.fillStyle = cssVar("--ink-3");
  for (const id in LAY.nodes) { const L = LAY.nodes[id]; mx.fillRect(MO + L.x * MS, MO + L.y * MS, Math.max(1, L.w * MS), Math.max(1, L.h * MS)); }
  const r = stage.getBoundingClientRect();
  mx.strokeStyle = cssVar("--accent"); mx.lineWidth = 2;
  mx.strokeRect(MO + (-view.x / view.s) * MS, MO + (-view.y / view.s) * MS, (r.width / view.s) * MS, (r.height / view.s) * MS);
}
const miniJump = ev => {
  const b = mc.getBoundingClientRect(), k = mc.width / b.width;
  const wx = ((ev.clientX - b.left) * k - MO) / MS, wy = ((ev.clientY - b.top) * k - MO) / MS, r = stage.getBoundingClientRect();
  view.x = r.width / 2 - wx * view.s; view.y = r.height / 2 - wy * view.s; apply();
};
mini.addEventListener("pointerdown", ev => { mini.setPointerCapture(ev.pointerId); miniJump(ev); mini.onpointermove = miniJump; });
mini.addEventListener("pointerup", () => { mini.onpointermove = null; });

// tooltip
const tip = $("tip");
function edgeTip(e) { return `<b>${esc(nodes[e.from].label)} → ${esc(nodes[e.to].label)}</b><br>${esc(e.label || KINDS[e.k].name)}${e.proto ? `<br><code>${esc(e.proto)}</code>` : ""}`; }
function showTip(ev, html) { tip.innerHTML = html; tip.hidden = false; moveTip(ev); }
function moveTip(ev) { const r = stage.getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14; if (x + 330 > r.width) x = Math.max(8, x - 350); tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.hidden = true; }

// ---- filters ----
const hidden = new Set();
const counts = {}; for (const e of edges) counts[e.k] = (counts[e.k] || 0) + 1;
for (const k of Object.keys(KINDS)) {
  if (!counts[k]) continue;
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true"); b.style.color = col(k);
  b.innerHTML = `<i class="${KINDS[k].s}"></i><span style="color:var(--ink)">${KINDS[k].name}</span><span class="n">${counts[k]}</span>`;
  b.onclick = () => { if (hidden.has(k)) hidden.delete(k); else hidden.add(k); b.setAttribute("aria-pressed", String(!hidden.has(k))); applyFilter(); };
  $("filters").appendChild(b);
}
function applyFilter() { for (const e of edges) { const x = edgeEls[e.i]; if (!x) continue; const off = hidden.has(e.k); x.p.style.display = off ? "none" : ""; x.h.style.display = off ? "none" : ""; } if (sel) select(sel, { keepView: true }); }

// ---- selection + panel ----
let sel = null;
const panel = $("panel");
const panelOpen = () => !panel.hidden;
function select(id, { keepView = false } = {}) {
  if (!nodes[id]) return; sel = id; hideTip();
  svg.classList.add("focus");
  for (const k in nodeEls) nodeEls[k].classList.remove("hl", "sel");
  for (const x of edgeEls) if (x) x.p.classList.remove("hl");
  nodeEls[id].classList.add("hl", "sel");
  for (const e of [...adj[id].in, ...adj[id].out]) {
    if (hidden.has(e.k)) continue;
    edgeEls[e.i]?.p.classList.add("hl"); nodeEls[e.from]?.classList.add("hl"); nodeEls[e.to]?.classList.add("hl");
  }
  renderPanel(id);
  if (!keepView) centerOn(id); else ensureVisible(id);
}
function ensureVisible(id) {
  const L = LAY.nodes[id], r = stage.getBoundingClientRect(), pw = innerWidth > 640 ? 380 : 0, ph = innerWidth <= 640 ? r.height * .62 : 0;
  const sx = view.x + L.x * view.s, sy = view.y + L.y * view.s, ex = sx + L.w * view.s, ey = sy + L.h * view.s;
  if (sx < 8 || sy < 8 || ex > r.width - pw - 8 || ey > r.height - ph - 8) centerOn(id, view.s);
}
function clearSel() { sel = null; svg.classList.remove("focus"); panel.hidden = true; for (const k in nodeEls) nodeEls[k].classList.remove("hl", "sel"); for (const x of edgeEls) if (x) x.p.classList.remove("hl"); }
function renderPanel(id) {
  const n = nodes[id], z = zones[n.zone];
  const flags = [];
  if (n.closed) flags.push(["Closed binary", ""]);
  if (n.default === "off") flags.push(["Off by default", ""]);
  if (n.variant === "MCP") flags.push(["MCP variant only", ""]);
  if (n.confidence === "low") flags.push(["Low confidence", "warn"]);
  else if (n.confidence === "medium") flags.push(["Medium confidence", ""]);
  const flowList = (list, dir) => list.filter(e => !hidden.has(e.k)).sort((a, b) => a.k.localeCompare(b.k)).map(e => {
    const other = dir === "in" ? e.from : e.to;
    return `<button data-go="${esc(other)}" style="color:${col(e.k)}"><i class="${KINDS[e.k].s}"></i><span class="who" style="color:var(--ink)">${dir === "in" ? "from " : "to "}${esc(nodes[other].label)}</span><span class="what">${esc(e.label || KINDS[e.k].name)}${e.proto ? ` <code>${esc(e.proto)}</code>` : ""}</span></button>`;
  }).join("") || `<p style="color:var(--ink-3)">None${hidden.size ? " with the current filters" : ""}.</p>`;
  panel.innerHTML = `
    <div class="panel-head"><div><div class="kind">${esc(n.kind || "")} · ${esc(z ? z.label : n.zone)}</div><h2>${esc(n.label)}</h2></div>
      <button id="pclose" aria-label="Close details">&times;</button></div>
    <div class="panel-body">
      ${flags.length ? `<div class="flags">${flags.map(([t, c]) => `<span class="flag ${c}">${t}</span>`).join("")}</div>` : ""}
      <p>${esc(n.desc || "")}</p>
      <div><h3>Inbound flows · ${adj[id].in.length}</h3><div class="flows">${flowList(adj[id].in, "in")}</div></div>
      <div><h3>Outbound flows · ${adj[id].out.length}</h3><div class="flows">${flowList(adj[id].out, "out")}</div></div>
      ${n.evidence ? `<div><h3>Evidence</h3><div class="ev">${esc(n.evidence)}</div></div>` : ""}
    </div>`;
  panel.hidden = false;
  $("pclose").onclick = clearSel;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
}

// ---- search ----
const q = $("q"), results = $("results");
const idx = INV.nodes.map(n => ({ id: n.id, hay: `${n.label} ${n.id} ${n.kind} ${zones[n.zone]?.label || ""} ${n.desc || ""}`.toLowerCase() }));
let hits = [], hi = 0;
function runSearch() {
  const t = q.value.trim().toLowerCase(); if (!t) { results.hidden = true; return; }
  hits = idx.map(x => ({ id: x.id, sc: nodes[x.id].label.toLowerCase().startsWith(t) ? 0 : nodes[x.id].label.toLowerCase().includes(t) ? 1 : x.hay.includes(t) ? 2 : 9 }))
    .filter(x => x.sc < 9).sort((a, b) => a.sc - b.sc || nodes[a.id].label.localeCompare(nodes[b.id].label)).slice(0, 12);
  hi = 0;
  results.innerHTML = hits.length ? hits.map((h, i) => `<button data-id="${esc(h.id)}" class="${i === 0 ? "on" : ""}"><span>${esc(nodes[h.id].label)}</span><small>${esc(nodes[h.id].kind || "")} · ${esc(zones[nodes[h.id].zone]?.label || "")}</small></button>`).join("") : `<button disabled><span>No component matches "${esc(q.value)}"</span></button>`;
  results.hidden = false;
  results.querySelectorAll("[data-id]").forEach(b => b.onclick = () => pick(b.dataset.id));
}
function pick(id) { results.hidden = true; q.blur(); select(id); }
q.addEventListener("input", runSearch);
q.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); if (!hits.length) return; hi = (hi + (ev.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length; results.querySelectorAll("[data-id]").forEach((b, i) => b.classList.toggle("on", i === hi)); }
  else if (ev.key === "Enter" && hits[hi]) pick(hits[hi].id);
  else if (ev.key === "Escape") { results.hidden = true; q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => results.hidden = true, 150));

// ---- start ----
$("loading").remove();
addEventListener("resize", () => { drawFar(); drawMini(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawMini);
new MutationObserver(drawMini).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
fitAll();
const h = location.hash.slice(1); if (h && nodes[h]) select(h);
})();
</script>

</body></html>
